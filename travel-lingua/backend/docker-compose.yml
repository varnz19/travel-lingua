version: '3.8'

services:
  backend:
    build: .
    container_name: travel-lingua-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Travel-Lingua Backend
      - API_V1_STR=/api/v1
      - SUPABASE_URL=https://travel-lingua.supabase.co
      - SUPABASE_JWT_SECRET=super-secret-supabase-jwt-key-for-development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: travel-lingua-redis
    ports:
      - "6379:6379"
    restart: always
